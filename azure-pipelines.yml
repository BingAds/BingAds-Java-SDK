# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main

pool:
  vmImage: windows-latest

resources:
  repositories:
  - repository: "WebXT.Pipeline.Templates"
    type: git
    name: Engineering Fundamentals/WebXT.Pipeline.Templates
    ref: refs/heads/main
extends:
  template: v1/WebXT.Official.EntryPoint.yml@WebXT.Pipeline.Templates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows
    stages:
    - stage: stage
      jobs:
      - job: Phase_1
        steps:
        - task: CmdLine@2
          inputs:
            script: |
              echo $(PUB_KEY) |  base64 -d > public.key
              echo $(SEC_KEY) |  base64 -d > private.key
              gpg --import public.key
              gpg --batch --import private.key
              gpg --list-public-keys
        # SFI-ES4.2.4: route all Maven artifact and plugin resolution through Azure
        # Artifacts instead of public endpoints (repo.maven.apache.org et al).
        # This must run BEFORE MavenAuthenticate@0, which edits ~/.m2/settings.xml
        # in place to add credentials for the mirror declared here.
        - task: PowerShell@2
          displayName: 'Install CI Maven settings.xml'
          inputs:
            targetType: inline
            script: |
              $m2 = Join-Path $env:USERPROFILE '.m2'
              New-Item -ItemType Directory -Force -Path $m2 | Out-Null
              Copy-Item -LiteralPath '$(Build.SourcesDirectory)\.pipelines\settings.xml' `
                        -Destination (Join-Path $m2 'settings.xml') -Force
              Write-Host "Installed settings.xml to $m2"
        - task: MavenAuthenticate@0
          displayName: 'Authenticate Maven to Azure Artifacts'
          inputs:
            artifactsFeeds: bing_ads_PublicPackages
        - task: Maven@3
          inputs:
            mavenPomFile: 'pom.xml'
            mavenOptions: '-Xmx3072m'
            javaHomeOption: 'JDKVersion'
            jdkVersionOption: '17'
            jdkArchitectureOption: 'x64'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            goals: 'package source:jar javadoc:jar gpg:sign checksum:files'
            options: '-Dgpg.passphrase=$(PASS_PHRASE)'
        - task: CopyFiles@2
          inputs:
            SourceFolder: '$(Pipeline.Workspace)/s'
            Contents: '**/.artifactignore'
            TargetFolder: $(Build.ArtifactStagingDirectory)/maven_artifacts
        - task: CopyFiles@2
          inputs:
            SourceFolder: 'target'
            Contents: '**/*'
            TargetFolder: $(Build.ArtifactStagingDirectory)/maven_artifacts
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: 'Publish Maven Artifacts'
            targetPath: $(Build.ArtifactStagingDirectory)/maven_artifacts
            artifactName: maven_artifacts